name: Release scheduled pages

# At 45 minutes past every hour, check whether a release is coming up in the
# next 30 minutes (or was missed in the last hour). If so, ask Netlify to
# rebuild. Builds run 20 minutes ahead, so a 6:00 release goes up around 5:46.
on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for releases due soon
        id: due
        run: |
          if python3 build.py --due 3600 --ahead 1800; then echo "due=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Rebuild the site on Netlify
        if: steps.due.outputs.due == 'yes' || github.event_name == 'workflow_dispatch'
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "NETLIFY_BUILD_HOOK secret is not set"; exit 1; fi
          curl -fsS -X POST -d '{}' "$HOOK" > /dev/null && echo "Rebuild requested"
